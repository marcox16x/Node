<h1 class="mb-3">Agregar estudiante</h1>

<div class="mb-3">
  <label class="form-label" for="nombre">Nombre</label>
  <input id="nombre" class="form-control" [(ngModel)]="nombre" name="nombre" />
</div>

<div class="mb-3">
  <label class="form-label" for="creditos">Créditos</label>
  <input id="creditos" type="number" class="form-control" [(ngModel)]="creditos" name="creditos" />
</div>

<div class="d-flex align-items-center">
  <button class="btn btn-primary" (click)="guardar()">Guardar</button>
  <a class="btn btn-secondary ms-2" routerLink="/">Cancelar</a>
</div>

<p class="text-danger mt-3" *ngIf="mensaje">{{ mensaje }}</p>
